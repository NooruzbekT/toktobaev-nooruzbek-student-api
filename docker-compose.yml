# Student API by Nooruzbek Toktobaev
# Usage: cp .env.example .env  (set your own password)  &&  docker compose up -d --build
name: toktobaev-nooruzbek-student-api

services:
  db:
    image: postgres:16-alpine
    container_name: toktobaev-nooruzbek-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - student-net
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        APP_VERSION: "1.1.0"
    image: toktobaev-nooruzbek-student-api:v1.1-toktobaev-nooruzbek
    container_name: toktobaev-nooruzbek-app
    environment:
      # "db" is the Compose service name, Docker DNS resolves it inside the network
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - student-net
    restart: unless-stopped

volumes:
  pgdata:
    name: toktobaev-nooruzbek-pgdata

networks:
  student-net:
    name: toktobaev-nooruzbek-net
